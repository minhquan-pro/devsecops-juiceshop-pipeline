services:
  juice-shop:
    # Immutable pinned image digest for strict academic reproducibility
    image: bkimminich/juice-shop:v15.0.0@sha256:721fc2cf0de50f11181be391152a5509c25fb13d0a21852277d13e3871dd6cf2
    ports:
      - "127.0.0.1:3000:3000"
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
